services:
  db:
    image: postgres:17-alpine
    container_name: mashcode_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mashcode
      POSTGRES_PASSWORD: mashcode
      POSTGRES_DB: mashcode
    ports:
      - "5432:5432"
    volumes:
      - mashcode_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mashcode -d mashcode"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mashcode_pgdata:
